services:
  postgres:
    image: postgres:16-alpine
    container_name: jobqueue_postgres
    environment:
      POSTGRES_USER: jobqueue
      POSTGRES_PASSWORD: jobqueue_secret
      POSTGRES_DB: jobqueue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Tune for observability — log slow queries, log DDL changes.
    command: >
      postgres
        -c log_min_duration_statement=100
        -c log_statement=ddl
        -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobqueue -d jobqueue"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.api
    container_name: jobqueue_api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://jobqueue:jobqueue_secret@postgres:5432/jobqueue?sslmode=disable
      API_PORT: "8080"
      MIGRATIONS_PATH: migrations
    # Don't start until postgres is healthy — healthcheck above must pass.
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  worker:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.worker
    container_name: jobqueue_worker
    environment:
      DATABASE_URL: postgres://jobqueue:jobqueue_secret@postgres:5432/jobqueue?sslmode=disable
      MIGRATIONS_PATH: migrations
      WORKER_CONCURRENCY: "3"
      WORKER_LEASE_DURATION: 30s
      WORKER_HEARTBEAT_INTERVAL: 10s
      WORKER_POLL_INTERVAL: 2s
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    # Scale workers horizontally:
    # docker compose up --scale worker=3

volumes:
  pgdata:
